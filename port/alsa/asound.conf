# ALSA config for the AIY Voice HAT (Voice Kit v1), installed as /etc/asound.conf.
#
# The voiceHAT codec has no mixer controls and only does S32_LE, 2 channels, 48 kHz,
# so volume and mic gain come from plugins here (as in Google's 2017 image), and
# dmix/dsnoop let several programs play and record at the same time.

pcm.voicehat_dmix {
    type dmix
    ipc_key 5611
    ipc_perm 0666
    slave {
        pcm "hw:CARD=sndrpigooglevoi,DEV=0"
        format S32_LE
        rate 48000
        channels 2
    }
}

pcm.voicehat_dsnoop {
    type dsnoop
    ipc_key 5612
    ipc_perm 0666
    slave {
        pcm "hw:CARD=sndrpigooglevoi,DEV=0"
        format S32_LE
        rate 48000
        channels 2
    }
}

# Playback volume: "Master" appears in amixer after the first playback through it.
pcm.softvol {
    type softvol
    slave.pcm "voicehat_dmix"
    control {
        name "Master"
        card sndrpigooglevoi
    }
}

# Mic gain x4 (+12 dB). The raw level is low (quiet speech peaks around -27 dBFS),
# but Google's old x30 clipped even quiet speech.
pcm.micboost {
    type route
    slave.pcm "voicehat_dsnoop"
    ttable {
        0.0 4.0
        1.1 4.0
    }
}

pcm.!default {
    type asym
    playback.pcm "plug:softvol"
    capture.pcm "plug:micboost"
}

ctl.!default {
    type hw
    card sndrpigooglevoi
}
