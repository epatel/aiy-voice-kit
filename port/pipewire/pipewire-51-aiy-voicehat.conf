# Installed as /etc/pipewire/pipewire.conf.d/51-aiy-voicehat.conf (install.sh --ha-satellite).
#
# Voice HAT sink and source over the ALSA plugins in /etc/asound.conf, so PipeWire
# gets the softvol Master volume and the x4 mic gain, and shares the card through
# dmix/dsnoop with plain ALSA programs (aiy.voice.audio, arecord). The node
# descriptions are used as device names by linux-voice-assistant.service.
context.objects = [
  { factory = adapter
    args = {
      factory.name     = api.alsa.pcm.sink
      node.name        = "aiy_voicehat_out"
      node.description = "Voice HAT speaker (Master volume)"
      media.class      = "Audio/Sink"
      api.alsa.path    = "plug:softvol"
      audio.format     = "S32LE"
      audio.rate       = 48000
      audio.channels   = 2
      audio.position   = [ FL FR ]
      priority.session = 2000
      priority.driver  = 2000
    }
  }
  { factory = adapter
    args = {
      factory.name     = api.alsa.pcm.source
      node.name        = "aiy_voicehat_in"
      node.description = "Voice HAT mics (x4 gain)"
      media.class      = "Audio/Source"
      api.alsa.path    = "plug:micboost"
      audio.format     = "S32LE"
      audio.rate       = 48000
      audio.channels   = 2
      audio.position   = [ FL FR ]
      priority.session = 2000
      priority.driver  = 2000
    }
  }
]
