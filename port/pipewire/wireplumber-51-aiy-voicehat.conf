# Installed as /etc/wireplumber/wireplumber.conf.d/51-aiy-voicehat.conf (install.sh --ha-satellite).
#
# Don't open the Voice HAT directly: PipeWire uses it through the ALSA plugins in
# /etc/asound.conf instead (see pipewire.conf.d/51-aiy-voicehat.conf). Opening the
# hw device would bypass the Master volume and mic gain and lock out other ALSA
# programs. HDMI audio is unused.
monitor.alsa.rules = [
  {
    matches = [
      { device.name = "alsa_card.platform-soc_sound" }
      { device.name = "~alsa_card.platform-.*hdmi" }
    ]
    actions = { update-props = { device.disabled = true } }
  }
]
